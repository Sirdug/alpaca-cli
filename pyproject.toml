[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-cli"
version = "0.1.0"
description = "Unofficial command-line interface for the Alpaca Trading and Market Data APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "jmespath>=1.0",
    "urllib3<2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
alpaca = "alpaca_cli.cli:main"
alpaca-mcp = "alpaca_cli.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
