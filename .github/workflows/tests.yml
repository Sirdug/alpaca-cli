name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - if: matrix.python == '3.12'
        run: python -m pip install -e ".[mcp]"
      - if: matrix.python == '3.12'
        run: python -c "from alpaca_cli import mcp_server"
      - run: python -m unittest discover -s tests -v
      - run: alpaca --help
      - run: python -m alpaca_cli --version
      - if: runner.os == 'Windows'
        name: Test Windows installer (PowerShell 5.1)
        shell: powershell
        run: |
          $options = @{ Python = (Get-Command python).Source }
          if ('${{ matrix.python }}' -eq '3.12') { $options.Mcp = $true }
          & .\tests\test_install_windows.ps1 @options
      - if: runner.os != 'Windows'
        name: Check installer syntax
        run: bash -n install.sh
      - if: runner.os != 'Windows'
        name: Test installer
        shell: bash
        run: |
          options=()
          if [ '${{ matrix.python }}' = '3.12' ]; then options+=(--mcp); fi
          bash install.sh --python "$(command -v python)" --install-dir "$RUNNER_TEMP/alpaca env" --bin-dir "$RUNNER_TEMP/alpaca bin" "${options[@]}"
          "$RUNNER_TEMP/alpaca bin/alpaca" --help
          bash install.sh --python "$(command -v python)" --install-dir "$RUNNER_TEMP/alpaca env" --bin-dir "$RUNNER_TEMP/alpaca bin" "${options[@]}"
          mkdir "$RUNNER_TEMP/unmanaged"
          if bash install.sh --install-dir "$RUNNER_TEMP/unmanaged"; then exit 1; fi
          mkdir "$RUNNER_TEMP/conflicting bin"
          printf 'existing command' > "$RUNNER_TEMP/conflicting bin/alpaca"
          if bash install.sh --install-dir "$RUNNER_TEMP/alpaca env" --bin-dir "$RUNNER_TEMP/conflicting bin"; then exit 1; fi
          test "$(cat "$RUNNER_TEMP/conflicting bin/alpaca")" = 'existing command'
